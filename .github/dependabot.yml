version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
  - package-ecosystem: "npm"
    directory: "/sdk"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "sdk"
  - package-ecosystem: "npm"
    directory: "/mcp-server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "mcp-server"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # Node's release line alternates LTS (even majors: 18/20/22/24...) with
      # Current-only releases (odd majors: 19/21/23/25...) that lose support in
      # ~6 months. Dependabot has no "even major only" filter, so block ALL major
      # bumps of the base image and require a human to intentionally re-pin to the
      # next LTS major (see e3bfdacc, which auto-bumped to non-LTS node:25).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
