name: MindForge Control Plane

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  classify:
    name: 🔍 Change Classification
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.classifier.outputs.tier }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci

      - name: Run Classifier
        id: classifier
        run: node bin/change-classifier.js

      - name: Tier Summary
        run: |
          echo "### 🔍 Change Classification Result" >> $GITHUB_STEP_SUMMARY
          echo "- **Governance Tier:** ${{ steps.classifier.outputs.tier }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.classifier.outputs.tier }}" == "3" ]; then
            echo "- ⚠️ **High Risk Changes Detected** — Tier 3 Governance Gate Enforced." >> $GITHUB_STEP_SUMMARY
          fi

  governance-gate:
    name: ⚖️ Governance Enforcement
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Runs on EVERY build, not only Tier-3 ones: a corrupt approval record is corrupt
      # regardless of the tier, and a required check that only executes on 28% of pushes has no
      # failure mode the rest of the time.
      #
      # This step used to be an inline `node -e` asking "does .planning/approvals/ contain a file
      # clearing an identity bar?" — a pure function of the DIRECTORY, not of the change.
      # Measured: the identical script exited 0 in a temp dir with no git repository at all. One
      # record committed 2026-06-11 for version 11.5.1 satisfied it for 67 days and 286 commits
      # against 11.9.2, and it was committed in c6ec9a9 — the same commit that relaxed the gate
      # to accept it.
      #
      # It now INTEGRITY-checks records (schema, recomputable checksum, honest identity marking,
      # bound to this release, unexpired) and DISCLOSES Tier-3 changes without blocking them.
      # Authorization is branch protection's job — a required PR plus required status checks —
      # because a git-tracked file cannot carry authorization: anyone who can push can write one.
      # See the header of bin/governance/verify-approvals.js for the full reasoning.
      # TIER goes through env: rather than being interpolated into the run: body. The value is a
      # single digit written by bin/change-classifier.js today, so it is not injectable now — but
      # `${{ }}` inside run: is textual substitution before the shell sees it, so the moment that
      # output carries anything richer it becomes a command-injection point in the governance
      # workflow specifically. Quoting "$TIER" costs nothing and removes the class.
      - name: Verify approval records, and disclose Tier-3 changes
        env:
          TIER: ${{ needs.classify.outputs.tier }}
        run: node bin/governance/verify-approvals.js --tier "$TIER"

      - name: Security Scan
        run: node bin/mindforge-cli.js security-scan

  routing:
    name: 🚀 Pipeline Routing
    needs: [classify, governance-gate]
    if: needs.governance-gate.result == 'success'
    uses: ./.github/workflows/execution-plane.yml
    secrets: inherit

  ai-review:
    name: 🤖 AI Intelligence Layer
    needs: [classify, governance-gate]
    if: github.event_name == 'pull_request' && needs.governance-gate.result == 'success'
    uses: ./.github/workflows/ai-intelligence.yml
    secrets: inherit
