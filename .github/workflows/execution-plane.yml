name: MindForge Execution Plane

on:
  workflow_call:
    inputs:
      phase:
        type: string
        default: 'current'
      dry_run:
        type: boolean
        default: false

# Least privilege. This workflow declared no `permissions:` block, so every job inherited the
# repository default — frequently write-all, which hands a compromised action far more than it needs.
# Determined from what the workflow actually does, not guessed: no GITHUB_TOKEN reference, no `gh`
# CLI call, no github.rest API call, and no commit/tag/branch write. It checks out the repo and
# uploads artifacts, and artifact upload uses the Actions runtime token rather than GITHUB_TOKEN
# permissions, so read on contents is sufficient.
permissions:
  contents: read

jobs:
  headless-agent:
    name: ⚡ Agent Runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install dependencies
        run: |
          npm ci
          if [ -d "sdk" ]; then
            cd sdk && npm install && cd ..
          fi

      - name: Build SDK
        run: |
          if [ -d "sdk" ] && [ -f "sdk/tsconfig.json" ]; then
            cd sdk && npm run build && cd ..
          else
            echo "::notice::No SDK found - skipping build"
          fi

      - name: Verification
        run: |
          npm test
          npm run lint

      - name: Health Check
        run: node bin/mindforge-cli.js health --repair

      - name: Execute Workflow
        run: |
          DRY_FLAG=""
          if [ "${{ inputs.dry_run }}" == "true" ]; then DRY_FLAG="--dry-run"; fi
          node bin/mindforge-cli.js headless --phase ${{ inputs.phase }} $DRY_FLAG --output json > /tmp/headless-results.json

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: execution-artifacts-${{ github.run_id }}
          path: |
            .planning/HANDOFF.json
            .planning/AUDIT.jsonl
            AUTONOMOUS-REPORT.md
            /tmp/headless-results.json
