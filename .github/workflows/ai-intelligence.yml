name: MindForge AI Intelligence

on:
  workflow_call:
    inputs:
      llm_provider:
        description: "LLM provider to use: 'anthropic' or 'bedrock' (default: bedrock)"
        type: string
        default: 'bedrock'

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: 🤖 Multi-Model Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ inputs.llm_provider }}
        run: |
          npm ci
          # Install Bedrock SDK if provider is bedrock (or if no Anthropic key is set)
          if [ "$LLM_PROVIDER" = "bedrock" ] || [ -z "$ANTHROPIC_API_KEY" ]; then
            npm install @aws-sdk/client-bedrock-runtime --no-save
          fi

      - name: Detect active LLM provider
        id: detect_provider
        env:
          LLM_PROVIDER: ${{ inputs.llm_provider }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          # Auto-detect: use explicit input, then fall back to credential presence.
          #
          # BUG FIXED HERE. `llm_provider` defaults to 'bedrock' (see the `on.workflow_call.inputs`
          # block above) and control-plane.yml's ai-review job calls this workflow without ever
          # overriding that input. That meant `[ "$LLM_PROVIDER" = "bedrock" ]` was ALWAYS true,
          # short-circuiting the `||` before the credential check on the right ever ran — the
          # "fall back to credential presence" this comment promises was dead code. The
          # "Skip — no LLM credentials" step further down was consequently unreachable in practice:
          # this branch always won and always claimed "provider=bedrock" whether or not
          # AWS_ACCESS_KEY_ID actually had a value.
          #
          # That was latent for every PR, but only VISIBLE on ones where secrets are absent.
          # GitHub does not pass repository Actions secrets (AWS_ACCESS_KEY_ID etc.) to workflow
          # runs triggered by a pull_request event where the actor is dependabot[bot] — a GitHub
          # security feature, not a misconfiguration, and it affects every repo this way. On those
          # runs AWS_ACCESS_KEY_ID is empty, so this step still picked "bedrock" and the next step
          # failed with "Bedrock Converse error: Could not load credentials from any providers" —
          # observed on PRs #234-#239 (2026-08-26), all six Dependabot security-remediation PRs.
          # bin/mindforge-cli.js security-scan (a separate, non-LLM, required gate that runs in
          # control-plane.yml's governance-gate job on every PR including these) already ran and
          # passed on all of them; only this LLM-credential-detection bug was wrong.
          #
          # Requiring AWS_ACCESS_KEY_ID to actually be present before selecting bedrock makes the
          # credential check real again, and gets this job to the pre-existing, already-written
          # "Skip — no LLM credentials" path instead of attempting (and failing) a Bedrock call
          # with no credentials. This isn't a Dependabot-specific carve-out — it applies identically
          # to any PR (fork, human, or bot) that runs without LLM credentials configured, matching
          # the sibling workflow's already-documented, already-tested policy that AI review is
          # advisory and "not present on this repo (and never on fork/dependabot PRs)" per
          # .github/workflows/mindforge-ai-review.yml.
          if [ -n "$AWS_ACCESS_KEY_ID" ] && { [ "$LLM_PROVIDER" = "bedrock" ] || [ -z "$ANTHROPIC_API_KEY" ]; }; then
            echo "provider=bedrock" >> "$GITHUB_OUTPUT"
            echo "::notice::Using AWS Bedrock (us.anthropic.claude-sonnet-4-6)"
          elif [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "provider=anthropic" >> "$GITHUB_OUTPUT"
            echo "::notice::Using Anthropic direct API"
          else
            echo "provider=none" >> "$GITHUB_OUTPUT"
            echo "::warning::No LLM credentials found — set ANTHROPIC_API_KEY or AWS Bedrock secrets. This is expected, and non-blocking, for Dependabot/fork PRs: GitHub never grants them repository secrets."
          fi

      - name: Cross-Model Review (Bedrock)
        if: steps.detect_provider.outputs.provider == 'bedrock'
        # Advisory, not a merge gate — matches mindforge-ai-review.yml's already-tested policy
        # (tests/ci-gates-wired.test.js) that a cross-model review failure must not red the PR.
        # This is the safety net for cases the detect_provider fix above doesn't catch: a
        # transient Bedrock outage, an expired/rotated key, or a throttled request should still
        # surface as a visible warning annotation in the log, not a required-looking red X.
        continue-on-error: true
        env:
          MINDFORGE_LLM_PROVIDER: bedrock
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Credentials are decoded in Node by BedrockProvider.decodeCredential()
          # before being passed explicitly to BedrockRuntimeClient — the same
          # pattern as Trelix's BedrockBackend._decode_credential(). The AWS SDK
          # default credential chain is NOT used; credentials are passed explicitly.
          node bin/mindforge-cli.js cross-review \
            --models claude,gpt4o \
            --focus security,architecture \
            --output markdown > /tmp/review-summary.md

      - name: Cross-Model Review (Anthropic)
        if: steps.detect_provider.outputs.provider == 'anthropic'
        # Same rationale as the Bedrock step above: advisory, not a merge gate.
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node bin/mindforge-cli.js cross-review \
            --models claude,gpt4o \
            --focus security,architecture \
            --output markdown > /tmp/review-summary.md

      - name: Skip — no LLM credentials
        if: steps.detect_provider.outputs.provider == 'none'
        run: |
          echo "## ⚠️ AI Review Skipped" > /tmp/review-summary.md
          echo "" >> /tmp/review-summary.md
          echo "No LLM credentials configured. To enable AI review, add one of:" >> /tmp/review-summary.md
          echo "- **Anthropic**: set \`ANTHROPIC_API_KEY\` in GitHub Secrets" >> /tmp/review-summary.md
          echo "- **AWS Bedrock**: set \`AWS_ACCESS_KEY_ID\`, \`AWS_SECRET_ACCESS_KEY\`, \`AWS_REGION\` in GitHub Secrets" >> /tmp/review-summary.md
          echo "" >> /tmp/review-summary.md
          echo "See \`docs/enterprise-setup.md\` for configuration details." >> /tmp/review-summary.md

      - name: Publish Review Comment
        if: github.event_name == 'pull_request'
        # GitHub also caps GITHUB_TOKEN to read-only on pull_request runs authored by
        # dependabot[bot], regardless of the `permissions:` block above. createComment would
        # 403 there; that must not fail an otherwise-advisory job either.
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('/tmp/review-summary.md')) process.exit(0);
            const body = fs.readFileSync('/tmp/review-summary.md', 'utf8');
            if (!body.trim()) process.exit(0);
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      # Uploads only what this workflow writes. CODE-REVIEW.md and CROSS-REVIEW.md were listed
      # here and in mindforge-ai-review.yml, but NOTHING in the repository writes either name —
      # bin/review/cross-review-engine.js contains no writeFileSync at all. They produced a
      # not-found warning on every run while /tmp/review-summary.md (written at :77/:89/:94) carried
      # the actual content, so the upload worked and the dead entries were merely noise. Removed
      # rather than left in: a path list that names files nothing produces invites the assumption
      # that they exist.
      - name: Upload Review Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-review-reports
          if-no-files-found: warn
          path: |
            /tmp/review-summary.md
