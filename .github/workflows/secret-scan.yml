name: Secret scan

# Defence in depth behind .husky/pre-commit. The local hook can be bypassed with
# --no-verify or skipped when gitleaks is not installed; this cannot.
#
# Scans full history on push/PR, and on a schedule so a rule added later is
# applied retroactively to commits that predate it.

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # Weekly, so newly-added rules get applied to existing history.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Required: a shallow clone would scan only the tip commit and report
          # clean while a secret sits one commit back.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Verify the config loads
        # gitleaks PANICS on an invalid regex (Go's RE2 has no lookahead) and a
        # panicking scan can look like a passing one. Assert the config parses
        # before trusting any result from it.
        run: |
          set -euo pipefail
          if gitleaks detect --no-git -c .gitleaks.toml -s /dev/null 2>&1 | grep -qiE 'panic|MustCompile'; then
            echo "::error::.gitleaks.toml failed to compile — the scan below would be meaningless"
            exit 1
          fi
          echo "config compiles"

      - name: Scan full history
        run: gitleaks git --redact --config .gitleaks.toml --report-format sarif --report-path gitleaks.sarif .

      - name: Verify the scanner actually works
        # Regression guard. Asserts, with runtime-generated fake credentials:
        #   - the config LOADS (a panicking or rejected config reports like a pass)
        #   - real npm / GitHub PAT / Anthropic secrets are caught
        #   - the correct ${NPM_TOKEN} form is NOT flagged
        #   - no allowlist is broad enough to hide a real secret in the same file
        #   - full history is clean
        # Without this, deleting the custom rules would silently restore the gap
        # they exist to close: stock gitleaks does not detect npm tokens.
        run: bash scripts/ci/verify-secret-scan.sh

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
