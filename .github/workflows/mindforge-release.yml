name: MindForge Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Production Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run Full Test Suite
        run: npm test

      - name: Verify tag matches package.json version
        id: verify_version
        run: |
          # Strip leading 'v' from the tag ref (e.g. v11.2.0 -> 11.2.0)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Tag version:     ${TAG_VERSION}"
          echo "package.json:    ${PKG_VERSION}"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error title=Version Mismatch::Git tag (${TAG_VERSION}) does not match package.json (${PKG_VERSION}). Refusing to publish."
            exit 1
          fi
          echo "::notice::Tag matches package.json version (${PKG_VERSION}) ✅"
          echo "version=${PKG_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Check npm for existing version
        id: npm_check
        run: |
          VER="${{ steps.verify_version.outputs.version }}"
          # npm view exits non-zero / prints empty when the version is not published; tolerate both.
          PUBLISHED="$(npm view "mindforge-cc@${VER}" version 2>/dev/null || true)"
          if [ -n "${PUBLISHED}" ]; then
            echo "::notice::v${VER} already on npm — skipping publish"
            echo "already_published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::v${VER} not yet on npm — will publish"
            echo "already_published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Generate CHANGELOG
        run: |
          # Use internal changelog fetcher if available, or generate from git
          node bin/updater/changelog-fetcher.js --latest > /tmp/release-notes.md || \
          git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty=format:"* %s (%h)" > /tmp/release-notes.md

      - name: Build Package
        run: npm pack

      # Prove the SECOND package builds BEFORE the first one publishes.
      # This release publishes two packages from one run. The mcp-server publish step below
      # runs `npm install && npm run build` inline, so a TypeScript error there used to surface
      # only AFTER `mindforge-cc` had already gone to npm — leaving a half-published release
      # with no way back, because npm forbids republishing a version. Building here makes that
      # failure abort the run while both packages are still unpublished.
      # Deliberately NOT guarded by the already_published check: on a re-run we still want a
      # broken second package to stop the release.
      - name: Verify mcp-server builds (gates the publishes below)
        working-directory: mcp-server
        run: |
          npm install --no-audit --no-fund
          npm run build

      # MCP-VER: serverInfo.version is what every MCP client (Claude Desktop, Cursor, the
      # Docker MCP Catalog entry) displays and logs. v11.9.2 shipped a hardcoded '11.4.0'
      # inside the provenance-attested artifact because mcp-server/dist is gitignored and
      # therefore compiled at publish time, and nothing ever read the wire value. The root
      # `npm test` above CANNOT catch it: it runs before this build and never installs
      # mcp-server/node_modules, so the bundle check there self-skips. MF_REQUIRE_MCP_BUNDLE=1
      # turns that skip into a hard failure here — dist/ definitely exists now, and both
      # publishes are still ahead of us, so a drifted version aborts the release instead of
      # becoming unrepublishable on npm.
      - name: Verify MCP serverInfo.version matches the manifests (MCP-VER)
        env:
          MF_REQUIRE_MCP_BUNDLE: '1'
        run: node tests/mcp-server-version.test.js

      - name: Publish to npm
        if: steps.npm_check.outputs.already_published != 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Standalone MCP server — published as its own public package (mindforge-mcp-server)
      # so it can be listed on the official MCP Registry, Docker MCP Catalog, PulseMCP, etc.
      # The same bundle is also vendored into the Claude Code plugin; this publish is additive.
      - name: Publish standalone MCP server to npm
        id: mcp_publish
        working-directory: mcp-server
        run: |
          MCP_VER="$(node -p "require('./package.json').version")"
          PUBLISHED="$(npm view "mindforge-mcp-server@${MCP_VER}" version 2>/dev/null || true)"
          if [ -n "${PUBLISHED}" ]; then
            echo "::notice::mindforge-mcp-server@${MCP_VER} already on npm — skipping"
            exit 0
          fi
          npm install --no-audit --no-fund
          npm run build
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: /tmp/release-notes.md
          files: |
            mindforge-cc-*.tgz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
