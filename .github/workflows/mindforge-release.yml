name: MindForge Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  # ── PREFLIGHT ────────────────────────────────────────────────────────────────
  #
  # THE HOLE THIS CLOSES. Publishing is triggered by exactly one event: a `v*` tag push. The
  # repository's only ruleset ("MindForge protected branches") is `target: branch` with
  # `include: [refs/heads/main, refs/heads/develop]`, so its six required status checks —
  # Code Quality Gates, MindForge Health Check (20.x), Security Scan, Change Classification,
  # Governance Enforcement, gitleaks — apply to NOTHING on the path that actually publishes.
  # GitHub cannot attach required status checks to a tag, so a ruleset can never fix this; the
  # gate has to live in the workflow itself, ahead of the publish, which is what this job is.
  #
  # Before this, the only quality bar between `git tag` and a live npm release was `npm test`
  # inside the publish job. That left two gaps:
  #
  #   1. FOUR GATES NEVER RAN. harness:audit, harness:gate, harness:compliance --check and
  #      release:ready run on every branch push and pull request, and never on a tag. release:ready
  #      is the one that matters most here — it is the check that fails when CHANGELOG.md has no
  #      entry for the version being published.
  #   2. ANY COMMIT COULD BE PUBLISHED. Nothing asserted the tagged commit was on `main`. Tagging a
  #      feature branch, an unmerged experiment, or a reverted commit published it, with provenance
  #      attesting to that exact tree. The documented flow is develop -> release -> main, so
  #      requiring ancestry of `main` enforces the flow rather than inventing a new rule.
  #
  # Kept as a SEPARATE JOB with `needs:` rather than extra steps, so the publish job cannot start
  # at all until this is green. Steps in one job would also work, but a distinct job shows up as its
  # own check and cannot be reordered away by a later edit that inserts a step above it.
  #
  # KNOWN LIMIT, stated rather than glossed: for a tag push GitHub resolves the workflow file from the
  # TAGGED ref, so this job only exists on commits that already contain it. A tag placed on an older
  # commit runs that commit's workflow and is therefore ungated. That is inherent to tag-triggered
  # workflows and cannot be fixed here; the ancestry check below plus a `v*` tag ruleset restricting who
  # may create the ref are the two available mitigations.
  preflight:
    name: Release Preflight (gates + ancestry)
    runs-on: ubuntu-latest
    # LEAST PRIVILEGE. The workflow-level block grants contents: write + id-token: write because the
    # publish job needs them. This job only reads the tree and runs gates, so it takes neither — an
    # OIDC-minting capability has no business sitting in front of the gates, holding an `npm ci` that
    # executes the dependency tree's install lifecycle scripts.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # The tagged commit must be reachable from main. `--is-ancestor` is exact and needs no
      # string matching; `git fetch origin main` is explicit because a tag-push checkout has no
      # local main ref even at fetch-depth 0.
      - name: Tagged commit must be an ancestor of main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error title=Tag not on main::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not an ancestor of origin/main. Releases must be cut from main (develop -> release -> main). Merge the release branch into main, then move the tag."
            exit 1
          fi
          echo "::notice::${GITHUB_REF_NAME} is on main ✅"

      # The four gates the branch ruleset enforces on every PR and that a tag push never sees.
      # Run individually rather than chained with && so the log names the one that failed.
      - name: Harness audit
        run: npm run harness:audit
      - name: Harness gate (score floor + findings)
        run: npm run harness:gate
      - name: Harness adapter compliance (doc drift)
        run: npm run harness:compliance -- --check
      - name: Asset validation
        run: npm run validate:assets
      - name: Version channels in sync
        run: npm run version:check
      # v11.9.4 published two packages irreversibly and then died on the third: sdk/package.json had
      # no `repository` field, and npm compares that field against the attestation REGISTRY-SIDE at PUT.
      # `npm publish --dry-run` does not check it and no gate here did either, so the failure was
      # unreachable until after the point of no return. This makes it reachable in preflight.
      - name: Provenance metadata (every --provenance package can actually publish)
        run: npm run provenance:check
      # LAST, because it is the one most likely to fail on a real release attempt: it checks that
      # CHANGELOG.md contains an entry for the version about to be published.
      - name: Release readiness
        run: npm run release:ready

  release:
    name: Production Release
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # DELIBERATELY STILL 20, after an attempted bump to 22 was reverted.
      #
      # The bump was justified in this comment by npm's trusted publishing requiring Node >= 22.14.0.
      # That justification was wrong: measured, all three registry-writing steps here authenticate with
      # `NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}`, so this workflow does not use trusted publishing and
      # the floor does not apply to it.
      #
      # Worse, the bump added risk. The job that actually runs `tests/run-all.js` in CI is Code Quality
      # Gates, which uses NODE_VERSION=20 — so the suite has never executed on 22. Pointing the release
      # job at an unexercised Node major means a 22-only failure would first surface at release time,
      # with the tag pushed and nothing published. 20 is the version CI proves the suite on.
      #
      # Adopting trusted publishing is a real improvement but needs registry-side configuration and a
      # Node floor bump together; it is a follow-up, not a side effect of this change.
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      # SDK DEPS TOO, and this is not optional — it is what `npm test` needs.
      #
      # `npx eslint .` from the repo root discovers sdk/eslint.config.mjs, a nested flat config that
      # imports `typescript-eslint` — an SDK devDependency, not a root one. With root `npm ci` alone,
      # ESLint cannot LOAD and exits 2, and tests/verification-runner.test.js (which asserts the lint
      # stage passes on this repository) fails.
      #
      # Found by the v11.9.3 tag: the release run failed at "Run Full Test Suite" with
      # `Cannot find package 'typescript-eslint' imported from sdk/eslint.config.mjs`. It failed SAFELY —
      # before any publish step, so nothing reached npm and no dist-tag moved — but it failed for an
      # environment reason, not a code one. mindforge-ci.yml's Code Quality Gates job has always
      # installed the SDK for exactly this reason; the release job never did, and no test asserted the
      # two jobs install the same things.
      #
      # `npm install`, not `npm ci`: sdk/package-lock.json is present but the CI job it mirrors uses
      # install, and matching it exactly is the point.
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix sdk install --no-audit --no-fund

      - name: Run Full Test Suite
        run: npm test

      - name: Verify tag matches package.json version
        id: verify_version
        run: |
          # Strip leading 'v' from the tag ref (e.g. v11.2.0 -> 11.2.0)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Tag version:     ${TAG_VERSION}"
          echo "package.json:    ${PKG_VERSION}"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error title=Version Mismatch::Git tag (${TAG_VERSION}) does not match package.json (${PKG_VERSION}). Refusing to publish."
            exit 1
          fi
          echo "::notice::Tag matches package.json version (${PKG_VERSION}) ✅"
          echo "version=${PKG_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Check npm for existing version
        id: npm_check
        run: |
          VER="${{ steps.verify_version.outputs.version }}"
          # npm view exits non-zero / prints empty when the version is not published; tolerate both.
          PUBLISHED="$(npm view "mindforge-cc@${VER}" version 2>/dev/null || true)"
          if [ -n "${PUBLISHED}" ]; then
            echo "::notice::v${VER} already on npm — skipping publish"
            echo "already_published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::v${VER} not yet on npm — will publish"
            echo "already_published=false" >> "${GITHUB_OUTPUT}"
          fi

      # THE v11.9.3 RELEASE PAGE SHIPPED EMPTY BECAUSE OF THIS STEP.
      #
      # `changelog-fetcher.js --latest` exits 0 while writing ZERO bytes (reproduced locally: exit 0,
      # 0 bytes), so the `||` fallback never fired, /tmp/release-notes.md was empty, and
      # action-gh-release published a release with a tarball and no notes at all. A 195-line changelog
      # existed in-tree and reached nobody. That is precisely the defect class 11.9.3 is named for: a
      # step reporting success having produced nothing.
      #
      # Now: prefer the in-tree changelog for the version being released, which is the document a human
      # actually wrote and which release:ready already proved exists; fall back to the fetcher, then to
      # git log; and FAIL if all three produce an empty file rather than publishing a blank page.
      - name: Generate CHANGELOG
        id: changelog
        run: |
          VER="${GITHUB_REF_NAME#v}"
          NOTES=/tmp/release-notes.md
          : > "${NOTES}"

          if [ -f "changelogs/v${VER}.md" ]; then
            # Strip the archive file's own `# Changelog` heading; keep the version section.
            sed -n "/^## \[${VER}\]/,\$p" "changelogs/v${VER}.md" > "${NOTES}" || true
          fi

          if [ ! -s "${NOTES}" ]; then
            node bin/updater/changelog-fetcher.js --latest > "${NOTES}" 2>/dev/null || true
          fi

          if [ ! -s "${NOTES}" ]; then
            git log "$(git describe --tags --abbrev=0 HEAD^)..HEAD" --pretty=format:"* %s (%h)" > "${NOTES}" || true
          fi

          if [ ! -s "${NOTES}" ]; then
            echo "::error title=Empty release notes::All three sources produced nothing. Refusing to publish a release with a blank body."
            exit 1
          fi
          echo "::notice::release notes: $(wc -c < "${NOTES}") bytes from $(wc -l < "${NOTES}") lines"
          head -3 "${NOTES}"

      - name: Build Package
        id: pack
        run: npm pack

      # Prove the SECOND package builds BEFORE the first one publishes.
      # This release publishes two packages from one run. The mcp-server publish step below
      # runs `npm install && npm run build` inline, so a TypeScript error there used to surface
      # only AFTER `mindforge-cc` had already gone to npm — leaving a half-published release
      # with no way back, because npm forbids republishing a version. Building here makes that
      # failure abort the run while both packages are still unpublished.
      # Deliberately NOT guarded by the already_published check: on a re-run we still want a
      # broken second package to stop the release.
      - name: Verify mcp-server builds (gates the publishes below)
        working-directory: mcp-server
        run: |
          npm install --no-audit --no-fund
          npm run build

      # MCP-VER: serverInfo.version is what every MCP client (Claude Desktop, Cursor, the
      # Docker MCP Catalog entry) displays and logs. v11.9.2 shipped a hardcoded '11.4.0'
      # inside the provenance-attested artifact because mcp-server/dist is gitignored and
      # therefore compiled at publish time, and nothing ever read the wire value. The root
      # `npm test` above CANNOT catch it: it runs before this build and never installs
      # mcp-server/node_modules, so the bundle check there self-skips. MF_REQUIRE_MCP_BUNDLE=1
      # turns that skip into a hard failure here — dist/ definitely exists now, and both
      # publishes are still ahead of us, so a drifted version aborts the release instead of
      # becoming unrepublishable on npm.
      - name: Verify MCP serverInfo.version matches the manifests (MCP-VER)
        env:
          MF_REQUIRE_MCP_BUNDLE: '1'
        run: node tests/mcp-server-version.test.js

      - name: Publish to npm
        id: cc_publish
        if: steps.npm_check.outputs.already_published != 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        # RUNS EVEN IF A LATER-ORDERED STEP HAS ALREADY FAILED, but only when its own inputs are
        # good. Bare `if: always()` or bare `!cancelled()` would be wrong here: if Generate CHANGELOG
        # succeeds and Build Package fails, a bare guard publishes a release with a 0-byte body and an
        # unmatched .tgz glob (fail_on_unmatched_files defaults false at the pinned SHA) — the exact
        # bodyBytes=0 defect seen on v11.9.0/1/2. Conditioning on already_published as well as
        # cc_publish keeps the re-run path working, where that step's outcome is 'skipped', not 'success'.
        if: ${{ !cancelled()
          && steps.changelog.outcome == 'success'
          && steps.pack.outcome == 'success'
          && (steps.npm_check.outputs.already_published == 'true' || steps.cc_publish.outcome == 'success') }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: /tmp/release-notes.md
          files: |
            mindforge-cc-*.tgz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── `stable` dist-tag ──────────────────────────────────────────────────
      #
      # No workflow moved this, so it was moved by hand or not at all — and it was not at all.
      # Measured 2026-08-21 via `npm view mindforge-cc dist-tags --json`:
      #   { rc: 3.0.0-rc1, alpha: 6.2.0-alpha, stable: 11.8.3, latest: 11.9.2 }
      # `stable` sat FOUR patch releases behind `latest`, so `npm i mindforge-cc@stable` delivered
      # 11.8.3 — without any of the fixes in 11.9.0 through 11.9.2.
      #
      # PLACED LAST, AFTER `Create GitHub Release`, and that ordering is load-bearing. An earlier draft
      # put it before, which made a cosmetic and always-retryable concern a hard gate in front of the
      # release notes and the .tgz asset — for a release whose two npm publishes had already succeeded
      # and cannot be undone. Moving a dist-tag must never cost a release its artifacts.
      #
      # MONOTONIC. `npm dist-tag add` is idempotent per (package, version, tag) but never version-aware,
      # so without a guard this step moves `stable` BACKWARD on a re-run. Not hypothetical: a
      # published-but-failed run is the normal thing to re-run here (6 of the last 12 release runs are
      # failures, and v11.8.3's run shows publish=skipped, mcp_publish=failure, GitHub Release=skipped —
      # a run whose only outstanding work is the release artifact). Re-running one after a newer version
      # shipped would silently downgrade every `@stable` consumer, and the read-back would confirm the
      # downgrade as success. `sort -V` suffices because prereleases are excluded above, and it needs no
      # dependency — `semver` resolves locally but is in neither dependencies nor devDependencies.
      #
      # READS THE SAME ENDPOINT IT WRITES. `npm view <pkg> dist-tags.stable` fetches the PACKUMENT
      # (registry.npmjs.org/<pkg>), which is CDN-backed: measured `cache-control: public, max-age=300`,
      # `cf-cache-status: REVALIDATED`. `npm dist-tag ls` fetches `/-/package/<pkg>/dist-tags` —
      # `cf-cache-status: DYNAMIC`, the same path the write PUTs to. Verifying an uncached write through
      # the cached aggregate is how a correct move reads back stale and fails a perfect release. Same
      # lesson as the PyPI publish check: verify on the authoritative endpoint, not the convenient one.
      #
      # A READ FAILURE IS NOT A FAILED MOVE. The previous version swallowed stderr into an empty string,
      # so a 5xx or an expired token reported "dist-tag not moved" — a misattributed cause. Reads retry,
      # and the two outcomes are reported differently.
      #
      # PRERELEASES ARE SKIPPED. v12.0.0-rc1 must not become `stable`; those have their own `rc` and
      # `alpha` tags, which this deliberately does not touch.
      - name: Point the stable dist-tag at this release
        # RUNS EVEN IF A LATER-ORDERED STEP HAS ALREADY FAILED, but only when its own inputs are
        # good. Bare `if: always()` or bare `!cancelled()` would be wrong here: if Generate CHANGELOG
        # succeeds and Build Package fails, a bare guard publishes a release with a 0-byte body and an
        # unmatched .tgz glob (fail_on_unmatched_files defaults false at the pinned SHA) — the exact
        # bodyBytes=0 defect seen on v11.9.0/1/2. Conditioning on already_published as well as
        # cc_publish keeps the re-run path working, where that step's outcome is 'skipped', not 'success'.
        if: ${{ !cancelled()
          && steps.changelog.outcome == 'success'
          && steps.pack.outcome == 'success'
          && (steps.npm_check.outputs.already_published == 'true' || steps.cc_publish.outcome == 'success') }}
        run: |
          VER="${{ steps.verify_version.outputs.version }}"
          if [ -z "${VER}" ]; then
            echo "::error title=No version::verify_version produced no output; refusing to touch dist-tags."
            exit 1
          fi
          case "${VER}" in
            *-*)
              echo "::notice::${VER} is a prerelease — leaving the stable dist-tag alone"
              exit 0
              ;;
          esac

          read_stable() {
            npm dist-tag ls mindforge-cc 2>/dev/null | sed -n 's/^stable: //p'
          }

          CURRENT=""
          for attempt in 1 2 3; do
            CURRENT="$(read_stable)"
            [ -n "${CURRENT}" ] && break
            echo "dist-tag read attempt ${attempt} returned nothing; retrying in 5s"
            sleep 5
          done
          echo "stable currently: ${CURRENT:-<unset or unreadable>}"

          if [ -n "${CURRENT}" ] && [ "${CURRENT}" != "${VER}" ]; then
            NEWEST="$(printf '%s\n%s\n' "${CURRENT}" "${VER}" | sort -V | tail -1)"
            if [ "${NEWEST}" = "${CURRENT}" ]; then
              echo "::notice::stable is at ${CURRENT}, newer than ${VER} — refusing to move it backward"
              exit 0
            fi
          fi

          npm dist-tag add "mindforge-cc@${VER}" stable

          AFTER=""
          for attempt in 1 2 3; do
            AFTER="$(read_stable)"
            [ "${AFTER}" = "${VER}" ] && break
            echo "read-back attempt ${attempt} saw '${AFTER:-<unreadable>}'; retrying in 5s"
            sleep 5
          done
          if [ -z "${AFTER}" ]; then
            echo "::error title=dist-tag unverifiable::the write was accepted but stable could not be read back. Check manually: npm dist-tag ls mindforge-cc"
            exit 1
          fi
          if [ "${AFTER}" != "${VER}" ]; then
            echo "::error title=dist-tag not moved::stable reads '${AFTER}' after the update, expected '${VER}'."
            exit 1
          fi
          echo "::notice::stable -> ${VER} ✅"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Standalone MCP server — published as its own public package (mindforge-mcp-server)
      # so it can be listed on the official MCP Registry, Docker MCP Catalog, PulseMCP, etc.
      # The same bundle is also vendored into the Claude Code plugin; this publish is additive.
      - name: Publish standalone MCP server to npm
        id: mcp_publish
        # `!cancelled()` so a failure in the OTHER additive publish does not skip this one. Deliberately
        # not `continue-on-error`: a tolerated failure reports the whole run GREEN, which would recreate
        # the 'nothing noticed' blindness that let the SDK sit seven releases behind unattested.
        if: ${{ !cancelled() }}
        working-directory: mcp-server
        run: |
          MCP_VER="$(node -p "require('./package.json').version")"
          PUBLISHED="$(npm view "mindforge-mcp-server@${MCP_VER}" version 2>/dev/null || true)"
          if [ -n "${PUBLISHED}" ]; then
            echo "::notice::mindforge-mcp-server@${MCP_VER} already on npm — skipping"
            exit 0
          fi
          npm install --no-audit --no-fund
          npm run build
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # THIRD PACKAGE, and the reason it is here rather than "additive, later": mindforge-sdk sat at
      # 11.8.0 on npm while sync-version.js kept sdk/package.json at canonical, so the repository and
      # the registry disagreed by SEVEN releases (11.8.1 through 11.9.3, none published) and nothing
      # noticed — version:check verifies the tracked file, not what npm serves. It is also the only one
      # of the three packages with NO provenance attestation, so a consumer could not verify its
      # origin at all.
      #
      # Placed AFTER the two publishes above and BEFORE the GitHub Release, deliberately: it is the
      # newest step here and the least exercised, so it must not be able to cost the two proven
      # packages their release artifacts. Same reasoning that put the dist-tag step last.
      #
      # `npm ci` because sdk/package-lock.json is present and this is a publish, not the lint-parity
      # install above — an exact tree is worth more than matching the CI job here. `npm run build`
      # explicitly rather than relying on prepublishOnly: that hook runs `npm test`, which runs
      # `pretest` -> build anyway, but a build failure should surface as a build failure.
      - name: Publish the SDK to npm
        id: sdk_publish
        # `!cancelled()` so a failure in the OTHER additive publish does not skip this one. Deliberately
        # not `continue-on-error`: a tolerated failure reports the whole run GREEN, which would recreate
        # the 'nothing noticed' blindness that let the SDK sit seven releases behind unattested.
        if: ${{ !cancelled() }}
        working-directory: sdk
        run: |
          SDK_VER="$(node -p "require('./package.json').version")"
          PUBLISHED="$(npm view "mindforge-sdk@${SDK_VER}" version 2>/dev/null || true)"
          if [ -n "${PUBLISHED}" ]; then
            echo "::notice::mindforge-sdk@${SDK_VER} already on npm — skipping"
            exit 0
          fi
          npm ci --no-audit --no-fund
          npm run build
          npm publish --access public --provenance
          echo "::notice::mindforge-sdk@${SDK_VER} published with provenance ✅"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
